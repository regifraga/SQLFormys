<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso negado — SQLFormys</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="error.css">
    <script>
        (function () {
            var key = 'sqlformys_theme';
            var theme = localStorage.getItem(key);
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark'
                    : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="error-page-body">
    <header class="top-header" role="banner">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span>SQLFormys</span>
        </div>
    </header>

    <main class="error-page-main">
        <section class="empty-state error-page-card" role="alert">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-icon" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
                <line x1="18" y1="8" x2="23" y2="13"></line>
                <line x1="23" y1="8" x2="18" y2="13"></line>
            </svg>
            <h1 class="error-page-title">Usuário ou senha não encontrados</h1>
            <p class="error-page-text">
                Não foi possível autenticar com as credenciais informadas. Confira usuário e senha
                ou solicite acesso ao administrador do sistema.
            </p>
            <div class="error-page-actions">
                <button type="button" class="btn btn-primary" id="btn-retry-auth">Tentar novamente</button>
            </div>
            <p class="error-page-code">HTTP 401</p>
        </section>
    </main>

    <script>
        document.getElementById('btn-retry-auth').addEventListener('click', function () {
            window.location.href = '/';
        });
    </script>
</body>
</html>

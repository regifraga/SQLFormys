<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLFormys</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.min.js"></script>
    <script>
        (function () {
            var key = 'sqlformys_theme';
            var theme = localStorage.getItem(key);
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark'
                    : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>

    <!-- Header Superior -->
    <header class="top-header">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span>SQLFormys</span>
        </div>
        <div class="header-actions">
            <div class="user-menu-wrap hidden" id="user-menu-wrap">
                <button type="button" id="user-menu-toggle" class="user-badge-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu do usuário">
                    <svg class="user-badge-icon user-badge-icon--standard" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <svg class="user-badge-icon user-badge-icon--admin hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    <span class="user-badge-label" id="user-badge-label">usuário</span>
                </button>
                <div id="user-menu-dropdown" class="user-menu-dropdown hidden" role="menu">
                    <button type="button" class="user-menu-item hidden" id="user-menu-change-password" role="menuitem">Trocar senha</button>
                    <div class="user-menu-divider hidden" id="user-menu-divider" role="presentation"></div>
                    <button type="button" class="user-menu-item user-menu-item--logout" id="user-menu-logout" role="menuitem">Sair</button>
                </div>
            </div>
            <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-pressed="false" aria-label="Alternar tema claro e escuro">
                <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="theme-icon-sun hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            <div id="auth-unauthenticated" class="auth-unauthenticated hidden" role="status">
                Não autenticado na rede
            </div>
        </div>
    </header>

    <div class="app-container">
        <!-- Menu Lateral -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="menu-label">MENU</span>
                <button id="toggle-sidebar" class="icon-btn" aria-label="Recolher Menu" aria-expanded="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Gestão de usuários (admin) -->
            <div id="sidebar-admin-users" class="sidebar-admin-users hidden" aria-label="Gestão de usuários"></div>
            
            <!-- Filtro de Módulos -->
            <div class="sidebar-search">
                <div class="search-input-wrapper">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-modules" placeholder="Filtrar módulos..." autocomplete="off">
                    <button type="button" id="clear-search" class="clear-btn hidden" aria-label="Limpar filtro">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Área de Favoritos -->
            <div class="sidebar-favorites hidden" id="sidebar-favorites-container">
                <div class="favorites-header">
                    <span class="favorites-label">Favoritos</span>
                </div>
                <div class="favorites-list" id="sidebar-favorites-list">
                    <!-- Preenchido via Javascript -->
                </div>
            </div>
            
            <nav class="sidebar-nav tree-nav" id="tree-navigation">
                <!-- Árvore de Projetos e Módulos (Renderizado via JS) -->
                <div class="loading-state">Carregando estrutura...</div>
            </nav>

            <div class="sidebar-footer">
                <span class="version-info" id="app-version-info">SQLFormys</span>
                <span id="sidebar-auth-user" class="sidebar-auth-user hidden" aria-live="polite"></span>
            </div>

            <!-- Alça para redimensionamento -->
            <div class="sidebar-resizer" id="sidebar-resizer" data-tooltip="Arraste para redimensionar"></div>
        </aside>

        <!-- Área Principal de Conteúdo -->
        <main class="main-content">
            <div class="content-wrapper">
                <div id="form-container" class="card form-card hidden">
                    <div class="card-header form-card-header">
                        <h2 id="form-title">Módulo</h2>
                        <span class="module-path" id="form-subtitle">Projeto > Módulo</span>
                        <p id="form-description" class="form-description hidden"></p>
                        <div id="form-meta-container" class="form-meta-container hidden"></div>
                        <button type="button" id="form-module-edit-btn" class="tree-icon-btn form-module-edit-btn hidden" aria-label="Editar SQL" data-tooltip="Editar SQL"></button>
                    </div>
                    <div class="card-body">
                        <form id="dynamic-form">
                            <!-- Campos do formulário renderizados via JS -->
                        </form>
                    </div>
                    <div class="card-footer">
                        <button type="button" class="btn btn-secondary" id="btn-cancel">Cancelar</button>
                        <button type="button" class="btn btn-outline" id="btn-clear">Limpar</button>
                        <button type="button" class="btn btn-primary" id="btn-execute">Executar</button>
                    </div>
                </div>

                <!-- Container da Grid de Resultados -->
                <div id="grid-container" class="card grid-card hidden" style="margin-top: 24px;">
                    <div class="card-header">
                        <div class="header-title-group">
                            <h2 id="grid-title">Resultados</h2>
                            <div id="execution-time" class="execution-time hidden"></div>
                        </div>
                        <div class="grid-search hidden" id="grid-search-container">
                            <div class="search-input-wrapper">
                                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                                <input type="text" id="search-grid" placeholder="Filtrar grid..." autocomplete="off">
                                <button type="button" id="clear-grid-search" class="clear-btn hidden" aria-label="Limpar filtro">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="grid-actions hidden">
                            <button id="btn-export-csv" class="btn btn-secondary btn-sm" data-tooltip="Exportar para CSV">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                CSV
                            </button>
                            <button id="btn-export-excel" class="btn btn-secondary btn-sm" data-tooltip="Exportar para Excel">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                Excel
                            </button>
                        </div>
                    </div>
                    <div class="card-body result-card-body" style="overflow-x: auto; padding: 0;">
                        <table class="data-table" id="result-table">
                            <thead id="result-thead"></thead>
                            <tbody id="result-tbody"></tbody>
                        </table>
                        <div id="result-document" class="result-document hidden"></div>
                        <div id="grid-empty-state" class="hidden" style="padding: 24px; text-align: center; color: var(--text-secondary);">
                            Nenhum registro encontrado.
                        </div>
                    </div>
                </div>

                <div id="sql-editor-container" class="card form-card sql-editor-card hidden">
                    <div class="card-header">
                        <h2 id="sql-editor-title">Editor SQL</h2>
                        <span class="module-path" id="sql-editor-subtitle"></span>
                    </div>
                    <div class="card-body sql-editor-body">
                        <textarea id="sql-editor-textarea" aria-label="Conteúdo SQL"></textarea>
                    </div>
                    <div class="card-footer">
                        <button type="button" class="btn btn-secondary" id="sql-editor-cancel">Cancelar</button>
                        <button type="button" class="btn btn-primary" id="sql-editor-save">Salvar</button>
                    </div>
                </div>

                <div id="empty-state" class="empty-state">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-icon">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="9" y1="21" x2="9" y2="9"></line>
                    </svg>
                    <h3>Selecione um Módulo</h3>
                    <p>Escolha um módulo no menu lateral para visualizar e preencher seu respectivo formulário.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Container para Toasts de Notificação -->
    <div id="toast-container" class="toast-container"></div>

    <div id="app-modal-backdrop" class="app-modal-backdrop hidden" aria-hidden="true">
        <div class="app-modal" role="dialog" aria-modal="true" aria-labelledby="app-modal-title">
            <div class="app-modal-header">
                <h3 id="app-modal-title">Confirmação</h3>
                <button type="button" class="icon-btn app-modal-close" id="app-modal-close" aria-label="Fechar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="app-modal-body" id="app-modal-body"></div>
            <div class="app-modal-footer" id="app-modal-footer"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
    <script src="theme.js"></script>
    <script src="auth.js"></script>
    <script src="user-menu.js"></script>
    <script src="admin-panel.js?v=form-module-edit-1"></script>
    <script src="app.js?v=form-module-edit-1"></script>
</body>
</html>

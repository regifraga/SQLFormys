server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    error_page 401 /401.html;
    error_page 500 502 503 504 /500.html;

    # Páginas de erro (sem Basic Auth)
    location = /401.html {
        auth_basic off;
        internal;
    }

    location = /500.html {
        auth_basic off;
        internal;
    }

  # CSS das páginas de erro (carregado sem credenciais após 401)
    location = /error.css {
        auth_basic off;
    }

    # Encerramento de sessão (sem Basic Auth — sobrescreve credenciais no navegador)
    location = /auth-logout.html {
        auth_basic off;
        try_files $uri =404;
    }

    # Estáticos
    location / {
        include /etc/nginx/snippets/sqlformys-basic-auth.conf;
        try_files $uri $uri/ /index.html;
    }

    # API — mesmo origin para Negotiate/Kerberos (encaminha Authorization)
    location /api/ {
        include /etc/nginx/snippets/sqlformys-basic-auth.conf;
        error_page 401 /401.html;
        error_page 500 502 503 504 /500.html;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Remote-User $remote_user;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
